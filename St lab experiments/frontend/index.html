<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoSort AI — Smart Waste Segregation & Recycling Optimization</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            eco: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
              950: '#052e16',
            },
          },
        },
      },
    };
  </script>

  <!-- Leaflet (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- TensorFlow.js & MobileNetV2 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>

  <!-- React 18 & Babel Standalone v7 (Classic Runtime) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .leaflet-container { z-index: 10; border-radius: 1rem; }
  </style>
</head>
<body class="bg-eco-50/60 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased transition-colors duration-200">
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;color:#14532d;">
      Loading EcoSort AI...
    </div>
  </div>

  <script>
    (async function loadEcoSortApp() {
      const modules = [
        '/src/utils/api.js',
        '/src/utils/wasteTaxonomy.js',
        '/src/components/Icons.jsx',
        '/src/components/Charts.jsx',
        '/src/components/Layout.jsx',
        '/src/pages/AuthPages.jsx',
        '/src/pages/UserDashboard.jsx',
        '/src/pages/AIDetectionPage.jsx',
        '/src/pages/SmartBinsPage.jsx',
        '/src/pages/RewardsEcoPage.jsx',
        '/src/pages/LocatorPage.jsx',
        '/src/pages/PickupSchedulePage.jsx',
        '/src/pages/AssistantPage.jsx',
        '/src/pages/HistoryPage.jsx',
        '/src/pages/ProfilePage.jsx',
        '/src/pages/AdminDashboard.jsx',
        '/src/App.jsx',
      ];
      try {
        const sources = await Promise.all(
          modules.map(async (url) => {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Failed to load ' + url);
            return { url, code: await res.text() };
          })
        );
        for (const mod of sources) {
          const transformed = window.Babel.transform(mod.code, {
            filename: mod.url,
            presets: [['react', { runtime: 'classic' }]],
          }).code;
          const scriptEl = document.createElement('script');
          scriptEl.text = transformed;
          document.body.appendChild(scriptEl);
        }
      } catch (err) {
        console.error('EcoSort startup error:', err);
        document.getElementById('root').innerHTML =
          '<div style="padding:2rem;color:#b91c1c;font-family:sans-serif;"><h2>Failed to load EcoSort AI</h2><pre>' +
          err.message +
          '</pre></div>';
      }
    })();
  </script>
</body>
</html>
